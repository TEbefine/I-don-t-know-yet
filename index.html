<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sap</title>
  <meta name="description" content="คืนที่เบาที่สุด — a softly told story on the web" />
  <meta name="theme-color" content="#6B9080" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/favicon.ico" sizes="any" />
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="icons/favicon-16.png" type="image/png" sizes="16x16" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <!-- iOS standalone -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Sap" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- Living gradient background -->
<canvas id="gradient"></canvas>
<div id="veil"></div>

<!-- Reading progress bar -->
<div id="progress-bar"></div>

<!-- Page counter -->
<div id="page-counter"></div>

<!-- TOC Button -->
<button id="toc-btn" aria-label="สารบัญ" title="สารบัญ">
  <svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>
</button>

<!-- TOC Page (สารบัญ) -->
<section id="toc-page">
  <button id="toc-close" aria-label="ปิด">
    <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
  </button>
  <div class="toc-title">สารบัญ</div>
  <ul class="toc-list" id="toc-list"></ul>
</section>

<!-- Home Page -->
<section id="home-page">
  <div class="home-cover">
    <div class="home-cover-img">
      <img src="SAP-01.png" alt="Sap Cover" />
    </div>
    <h1 class="home-title">Sap</h1>
    <p class="home-subtitle">คืนที่เบาที่สุด — a softly told story on the web</p>
    <button class="home-resume" id="home-resume">อ่านค้างไว้</button>
    <div class="home-actions">
      <button class="home-btn primary" id="home-start-btn">เริ่มอ่าน</button>
      <button class="home-btn secondary" id="home-toc-btn">สารบัญ</button>
    </div>
  </div>
</section>

<!-- Chapter View (page-based reader) -->
<div id="chapter-view">
  <div id="stage"></div>
  <!-- Invisible tap zones -->
  <div class="tap-zone tap-zone-prev" id="tap-prev"></div>
  <div class="tap-zone tap-zone-next" id="tap-next"></div>
</div>

<!-- App Engine -->
<script src="app.js"></script>

</body>
</html>
