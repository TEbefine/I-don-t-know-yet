<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sap</title>
<meta name="description" content="คืนที่เบาที่สุด — a softly told story on the web" />
<meta name="theme-color" content="#6B9080" />

<!-- Home Screen / PWA icons -->
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/favicon.ico" sizes="any" />
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32" />
<link rel="icon" href="icons/favicon-16.png" type="image/png" sizes="16x16" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

<!-- iOS standalone app settings -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Sap" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  /* ── EkkamaiVibe — Thai+Latin sans-serif ── */
  @font-face { font-family: "EkkamaiVibe"; src: url("EkkamaiVibe/EkkamaiVibe-thin.ttf") format("truetype"); font-weight: 100; font-display: swap; }
  @font-face { font-family: "EkkamaiVibe"; src: url("EkkamaiVibe/EkkamaiVibe-light.ttf") format("truetype"); font-weight: 300; font-display: swap; }
  @font-face { font-family: "EkkamaiVibe"; src: url("EkkamaiVibe/EkkamaiVibe-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "EkkamaiVibe"; src: url("EkkamaiVibe/EkkamaiVibe-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "EkkamaiVibe"; src: url("EkkamaiVibe/EkkamaiVibe-Heavy.ttf") format("truetype"); font-weight: 900; font-display: swap; }

  :root {
    --ink:        #2a2a2e;
    --ink-soft:   #565660;
    --ink-faint:  rgba(42,42,46,0.5);
    --paper:      #faf7f4;
    --panel:      rgba(250,247,244,0.62);
    --hair:       rgba(42,42,46,0.10);
    --sage:       #6B9080;

    --space-3: 16px; --space-4: 24px; --space-5: 32px;
    --space-6: 48px; --space-7: 64px; --space-8: 96px; --space-9: 160px;
    --measure: 600px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);

    --mono:  "IBM Plex Mono", ui-monospace, monospace;
    --sans:  "EkkamaiVibe", system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--paper);
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* living gradient */
  #gradient { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -2; display: block; }
  #veil {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(120% 80% at 50% 0%, rgba(250,247,244,0) 0%, rgba(250,247,244,0.35) 70%, rgba(250,247,244,0.7) 100%);
  }

  .wrap { max-width: var(--measure); margin-inline: auto; padding-inline: var(--space-4); }

  /* ── TOC Button (subtle, top-left) ── */
  #toc-btn {
    position: fixed; top: 20px; left: 20px; z-index: 100;
    width: 40px; height: 40px; border: none; border-radius: 50%;
    background: var(--panel); backdrop-filter: blur(12px);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 12px rgba(42,42,46,0.08);
    transition: opacity 0.4s var(--ease), transform 0.4s var(--ease);
    opacity: 0.6;
  }
  #toc-btn:hover { opacity: 1; transform: scale(1.08); }
  #toc-btn svg { width: 18px; height: 18px; stroke: var(--ink-soft); fill: none; stroke-width: 2; stroke-linecap: round; }

  /* ── TOC Page (สารบัญ) ── */
  #toc-page {
    position: fixed; inset: 0; z-index: 90;
    background: var(--paper);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: var(--space-6);
    opacity: 0; pointer-events: none;
    transition: opacity 0.6s var(--ease);
  }
  #toc-page.active { opacity: 1; pointer-events: auto; }
  .toc-title {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.28em;
    text-transform: uppercase; color: var(--ink-faint); margin-bottom: var(--space-7);
  }
  .toc-list { list-style: none; width: 100%; max-width: 420px; }
  .toc-item {
    display: flex; align-items: baseline; gap: 12px;
    padding: var(--space-4) 0;
    border-bottom: 1px solid var(--hair);
    cursor: pointer;
    transition: opacity 0.3s var(--ease);
  }
  .toc-item:hover { opacity: 0.7; }
  .toc-item:last-child { border-bottom: none; }
  .toc-num {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em;
    color: var(--ink-faint); white-space: nowrap; min-width: 60px;
  }
  .toc-info { flex: 1; }
  .toc-info-title {
    font-family: var(--sans); font-size: clamp(1.1rem, 1rem + 0.5vw, 1.35rem);
    font-weight: 400; color: var(--ink); line-height: 1.4;
  }
  .toc-info-sub {
    font-size: 0.85rem; color: var(--ink-soft); font-weight: 300;
    margin-top: 2px;
  }
  .toc-status {
    font-family: var(--mono); font-size: 12px; color: var(--sage);
    min-width: 20px; text-align: right;
  }
  .toc-close {
    margin-top: var(--space-7);
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em;
    color: var(--ink-faint); cursor: pointer; background: none; border: none;
    transition: color 0.3s;
  }
  .toc-close:hover { color: var(--ink); }

  /* ── Chapter View ── */
  #chapter-view {
    opacity: 0;
    transition: opacity 0.6s var(--ease);
  }
  #chapter-view.active { opacity: 1; }

  /* hero */
  header.hero {
    min-height: 76vh;
    display: flex; flex-direction: column; justify-content: center;
    text-align: center; padding: var(--space-8) var(--space-4);
  }
  .eyebrow {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.28em;
    text-transform: uppercase; color: var(--ink-faint); margin-bottom: var(--space-5);
  }
  h1 {
    font-family: var(--sans); font-weight: 400;
    font-size: clamp(2.6rem, 1.8rem + 4vw, 4.6rem); line-height: 1.08; letter-spacing: -0.01em;
  }
  .subtitle {
    font-weight: 300; font-size: clamp(1rem, 0.95rem + 0.4vw, 1.18rem);
    color: var(--ink-soft); margin-top: var(--space-5); font-style: italic;
  }
  .scroll-cue {
    margin-top: var(--space-8); font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.2em; color: var(--ink-faint); animation: float 3.2s var(--ease) infinite;
  }
  @keyframes float { 0%,100%{transform:translateY(0);opacity:.5} 50%{transform:translateY(6px);opacity:1} }

  main { padding-bottom: var(--space-9); }

  .block { margin-block: var(--space-9); opacity: 0; transform: translateY(28px);
    transition: opacity 1.1s var(--ease), transform 1.1s var(--ease); }
  .block.seen { opacity: 1; transform: none; }

  .b-text p {
    font-family: var(--sans); font-size: clamp(1.25rem, 1.1rem + 0.7vw, 1.6rem);
    line-height: 1.85; color: var(--ink); font-weight: 400;
  }

  .b-quote { text-align: center; padding-block: var(--space-5); }
  .b-quote .mark { font-family: var(--sans); font-size: 3rem; line-height: 0; color: var(--sage); opacity: .45; display: block; height: 1.2rem; }
  .b-quote blockquote { font-family: var(--sans); font-weight: 400; font-style: normal; font-size: clamp(1.5rem, 1.3rem + 1vw, 2.1rem); line-height: 1.6; color: var(--ink); margin-block: var(--space-4); }
  .b-quote cite { font-family: var(--mono); font-style: normal; font-size: 12px; letter-spacing: .12em; color: var(--ink-faint); }

  /* hero lead image */
  .hero-img { margin-top: calc(-1 * var(--space-7)); margin-bottom: var(--space-9);
    opacity: 0; transform: translateY(24px); transition: opacity 1.3s var(--ease), transform 1.3s var(--ease); }
  .hero-img.seen { opacity: 1; transform: none; }
  .hero-img img { width: 100%; height: auto; display: block; border-radius: 6px; box-shadow: 0 50px 95px -32px rgba(42,42,46,0.34); }
  .hero-img figcaption { font-family: var(--sans); font-size: 13px; font-weight: 300; letter-spacing: .04em; color: var(--ink-soft); text-align: center; margin-top: var(--space-3); }

  .b-image figure { margin: 0; }
  .b-image img { width: 100%; height: auto; display: block; border-radius: 4px; box-shadow: 0 40px 80px -30px rgba(42,42,46,0.28); }
  .b-image figcaption { font-family: var(--sans); font-size: 13px; font-weight: 300; letter-spacing: .04em; color: var(--ink-soft); text-align: center; margin-top: var(--space-3); }

  .b-music .frame { border-radius: 12px; overflow: hidden; box-shadow: 0 40px 80px -34px rgba(42,42,46,0.3); background: var(--panel); backdrop-filter: blur(8px); }
  .b-music iframe { display: block; width: 100%; border: 0; }
  .b-music .label { font-family: var(--mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-faint); text-align: center; margin-bottom: var(--space-4); }

  /* ── Chapter Navigation ── */
  .chapter-nav {
    display: flex; justify-content: space-between; align-items: center;
    padding: var(--space-7) var(--space-4) var(--space-8);
    max-width: var(--measure); margin-inline: auto;
  }
  .chapter-nav-btn {
    font-family: var(--sans); font-size: 0.95rem; font-weight: 300;
    color: var(--ink-soft); background: none; border: none;
    cursor: pointer; padding: var(--space-3) 0;
    transition: color 0.3s var(--ease), opacity 0.3s var(--ease);
    display: flex; align-items: center; gap: 8px;
  }
  .chapter-nav-btn:hover { color: var(--ink); }
  .chapter-nav-btn[disabled] { opacity: 0; pointer-events: none; }
  .chapter-nav-btn .arrow { font-size: 1.2em; }

  footer { text-align: center; padding: var(--space-8) var(--space-4) var(--space-7); font-family: var(--mono); font-size: 12px; letter-spacing: .2em; color: var(--ink-faint); }
  footer .sig { color: var(--ink-soft); }
  footer .breathe { margin-top: var(--space-4); }
  .divider { width: 36px; height: 1px; background: var(--hair); margin: 0 auto; }

  @media (prefers-reduced-motion: reduce) {
    .block, .hero-img { opacity: 1; transform: none; transition: none; }
    .scroll-cue { animation: none; } html { scroll-behavior: auto; }
    #toc-page, #chapter-view, #home-page { transition: none; }
  }

  /* ── Home Page (หน้าแรก) ── */
  #home-page {
    position: fixed; inset: 0; z-index: 80;
    background: transparent;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: var(--space-5);
    opacity: 0; pointer-events: none;
    transition: opacity 0.8s var(--ease), transform 0.8s var(--ease);
    transform: scale(0.98);
  }
  #home-page.active {
    opacity: 1; pointer-events: auto;
    transform: scale(1);
  }
  .home-cover {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    max-width: 440px; width: 100%;
  }
  .home-cover-img {
    width: 220px; height: 350px;
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 30px 60px rgba(42, 42, 46, 0.22);
    margin-bottom: var(--space-6);
    transition: transform 0.6s var(--ease);
  }
  .home-cover-img:hover {
    transform: scale(1.03) translateY(-4px);
  }
  .home-cover-img img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .home-title {
    font-family: var(--sans); font-weight: 700;
    font-size: clamp(2.4rem, 2rem + 2vw, 3.8rem);
    letter-spacing: -0.02em; color: var(--ink);
    margin-bottom: 8px;
  }
  .home-subtitle {
    font-family: var(--sans); font-weight: 300;
    font-size: 0.95rem; color: var(--ink-soft);
    margin-bottom: var(--space-6);
    font-style: italic;
  }
  .home-actions {
    display: flex; gap: 16px; width: 100%; justify-content: center;
  }
  .home-btn {
    font-family: var(--sans); font-size: 0.95rem; font-weight: 500;
    padding: 12px 32px; border-radius: 30px; border: none; cursor: pointer;
    transition: all 0.3s var(--ease);
  }
  .home-btn.primary {
    background: var(--sage); color: #fff;
    box-shadow: 0 4px 15px rgba(107, 144, 128, 0.25);
  }
  .home-btn.primary:hover {
    background: #5a7d6e; transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(107, 144, 128, 0.35);
  }
  .home-btn.secondary {
    background: var(--panel); color: var(--ink-soft);
    border: 1px solid var(--hair);
  }
  .home-btn.secondary:hover {
    background: var(--paper); color: var(--ink);
    transform: translateY(-2px);
  }

  /* ── Characters Section ── */
  .character-section {
    margin-top: var(--space-4);
    opacity: 0; transform: translateY(10px);
    animation: fadeUpIn 0.8s var(--ease) forwards 0.5s;
  }
  @keyframes fadeUpIn { to { opacity: 1; transform: translateY(0); } }
  
  .character-list {
    display: flex; justify-content: center; gap: 12px; list-style: none;
  }
  .character-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--hair);
    padding: 6px 14px; border-radius: 20px;
    cursor: pointer; transition: all 0.3s var(--ease);
  }
  .character-badge:hover {
    background: var(--paper); border-color: var(--sage); transform: translateY(-1px);
  }
  .character-avatar {
    width: 20px; height: 20px; border-radius: 50%; object-fit: cover;
  }
  .character-name {
    font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--ink-soft);
  }
  
  /* Modal for Character details */
  .char-modal {
    position: fixed; inset: 0; z-index: 110;
    background: rgba(42, 42, 46, 0.25);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    padding: var(--space-4);
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s var(--ease);
  }
  .char-modal.active {
    opacity: 1; pointer-events: auto;
  }
  .char-card {
    background: var(--paper);
    max-width: 380px; width: 100%;
    padding: var(--space-5);
    border-radius: 16px;
    box-shadow: 0 30px 70px rgba(42,42,46,0.18);
    text-align: center;
    transform: translateY(20px);
    transition: transform 0.4s var(--ease);
  }
  .char-modal.active .char-card {
    transform: translateY(0);
  }
  .char-card-avatar {
    width: 72px; height: 72px; border-radius: 50%; object-fit: cover;
    margin: 0 auto var(--space-4);
    border: 2px solid var(--sage);
    box-shadow: 0 8px 16px rgba(107, 144, 128, 0.15);
  }
  .char-card-name {
    font-family: var(--sans); font-weight: 500; font-size: 1.25rem; color: var(--ink);
  }
  .char-card-role {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--sage);
    text-transform: uppercase; margin-bottom: var(--space-4);
  }
  .char-card-bio {
    font-family: var(--sans); font-size: 0.95rem; line-height: 1.6; color: var(--ink-soft);
    margin-bottom: var(--space-5);
  }
  .char-card-close {
    font-family: var(--sans); font-size: 0.9rem; font-weight: 500;
    padding: 8px 24px; border-radius: 20px; border: none;
    background: var(--ink); color: var(--paper); cursor: pointer;
    transition: opacity 0.3s;
  }
  .char-card-close:hover { opacity: 0.9; }

  /* ── Extra TOC Navigation ── */
  .toc-home {
    margin-top: var(--space-5);
    font-family: var(--sans); font-size: 13px; font-weight: 400;
    color: var(--ink-soft); cursor: pointer; background: none; border: none;
    transition: color 0.3s;
  }
  .toc-home:hover { color: var(--ink); }
</style>
</head>
<body>

<canvas id="gradient"></canvas>
<div id="veil"></div>

<!-- TOC Button -->
<button id="toc-btn" aria-label="สารบัญ" title="สารบัญ">
  <svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>
</button>

<!-- TOC Page (สารบัญ) -->
<section id="toc-page">
  <div class="toc-title">✦ สารบัญ ✦</div>
  <ul class="toc-list" id="toc-list"></ul>
  <button class="toc-home" id="toc-home">← กลับหน้าแรก</button>
  <button class="toc-close" id="toc-close">↓ กลับไปอ่านต่อ</button>
</section>

<!-- Home Page (หน้าแรก) -->
<section id="home-page">
  <div class="home-cover">
    <div class="home-cover-img">
      <img src="SAP-01.png" alt="Sap Cover" />
    </div>
    <h1 class="home-title">Sap</h1>
    <p class="home-subtitle">คืนที่เบาที่สุด — a softly told story on the web</p>
    <div class="home-actions">
      <button class="home-btn primary" id="home-start-btn">เริ่มอ่าน</button>
      <button class="home-btn secondary" id="home-toc-btn">สารบัญ</button>
    </div>
  </div>
</section>

<!-- Chapter View -->
<div id="chapter-view">
  <header class="hero">
    <div class="eyebrow" id="eyebrow">a quiet place</div>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
    
    <!-- Character badge list -->
    <div class="character-section" id="character-section" hidden>
      <ul class="character-list" id="character-list"></ul>
    </div>

    <div class="scroll-cue">↓ scroll</div>
  </header>

  <figure class="hero-img wrap" id="heroFig" hidden>
    <img id="heroImg" alt="" />
    <figcaption id="heroCap"></figcaption>
  </figure>

  <main class="wrap" id="main"></main>

  <!-- Chapter Navigation -->
  <nav class="chapter-nav" id="chapter-nav">
    <button class="chapter-nav-btn" id="nav-prev" disabled>
      <span class="arrow">←</span> <span id="nav-prev-label"></span>
    </button>
    <button class="chapter-nav-btn" id="nav-next" disabled>
      <span id="nav-next-label"></span> <span class="arrow">→</span>
    </button>
  </nav>

  <footer>
    <div class="divider"></div>
    <div class="breathe sig" id="signature">SAP by Teera</div>
    <div class="breathe">breathe ◦ you're okay</div>
  </footer>
</div>

<!-- Character Detail Modal -->
<div class="char-modal" id="char-modal" role="dialog" aria-modal="true" aria-labelledby="char-modal-name">
  <div class="char-card">
    <img class="char-card-avatar" id="char-card-avatar" src="" alt="" />
    <h3 class="char-card-name" id="char-modal-name"></h3>
    <div class="char-card-role" id="char-card-role"></div>
    <p class="char-card-bio" id="char-card-bio"></p>
    <button class="char-card-close" id="char-card-close">ปิด</button>
  </div>
</div>

<script>
(function () {
  /* ══════════════════════════════════════
     SAP Chapter Engine
     ══════════════════════════════════════ */

  const APP = { title: "Sap", signature: "SAP by Teera" };

  // ── State ──
  let chapterList = [];        // manifest [{chapter, title, subtitle}]
  let currentChapter = null;   // loaded chapter data
  let currentChapterNum = 0;
  const characterCache = {};   // cached character metadata

  // ── DOM refs ──
  const tocPage      = document.getElementById("toc-page");
  const tocListEl    = document.getElementById("toc-list");
  const tocBtn       = document.getElementById("toc-btn");
  const tocClose     = document.getElementById("toc-close");
  const tocHome      = document.getElementById("toc-home");
  const homePage     = document.getElementById("home-page");
  const chapterView  = document.getElementById("chapter-view");
  const titleEl      = document.getElementById("title");
  const subtitleEl   = document.getElementById("subtitle");
  const eyebrowEl    = document.getElementById("eyebrow");
  const heroFig      = document.getElementById("heroFig");
  const heroImg      = document.getElementById("heroImg");
  const heroCap      = document.getElementById("heroCap");
  const mainEl       = document.getElementById("main");
  const navPrev      = document.getElementById("nav-prev");
  const navNext      = document.getElementById("nav-next");
  const navPrevLabel = document.getElementById("nav-prev-label");
  const navNextLabel = document.getElementById("nav-next-label");

  const charSection  = document.getElementById("character-section");
  const charListEl   = document.getElementById("character-list");

  // ── Helpers ──
  const esc = s => String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  function musicEmbed(url) {
    url = (url || "").trim();
    let m = url.match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(track|album|playlist|episode|show)\/([A-Za-z0-9]+)/);
    if (m) return `<iframe src="https://open.spotify.com/embed/${m[1]}/${m[2]}?theme=0" height="${m[1]==='track'?152:352}" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>`;
    m = url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    if (m) return `<iframe src="https://www.youtube.com/embed/${m[1]}?rel=0" height="315" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
    return `<div style="padding:24px;text-align:center;font-family:var(--mono);font-size:13px;color:var(--ink-faint)">paste a Spotify or YouTube link</div>`;
  }

  function renderBlock(b) {
    switch (b.type) {
      case "text":  return `<div class="block b-text"><p>${esc(b.body).replace(/\n/g,"<br>")}</p></div>`;
      case "quote": return `<div class="block b-quote"><span class="mark">&ldquo;</span><blockquote>${esc(b.body)}</blockquote>${b.by?`<cite>${esc(b.by)}</cite>`:""}</div>`;
      case "image": return `<div class="block b-image"><figure><img src="${esc(b.src)}" alt="${esc(b.caption||"")}" loading="lazy" />${b.caption?`<figcaption>${esc(b.caption)}</figcaption>`:""}</figure></div>`;
      case "music": return `<div class="block b-music"><div class="label">now playing</div><div class="frame">${musicEmbed(b.url)}</div></div>`;
      default:      return "";
    }
  }

  function observeBlocks() {
    const blocks = document.querySelectorAll(".block");
    if ("IntersectionObserver" in window) {
      const io = new IntersectionObserver((entries) => {
        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("seen"); io.unobserve(e.target); } });
      }, { threshold: 0.18 });
      blocks.forEach(b => io.observe(b));
    } else {
      blocks.forEach(b => b.classList.add("seen"));
    }
  }

  // ── Page Routing State ──
  function showPage(pageId) {
    homePage.classList.remove("active");
    chapterView.classList.remove("active");
    tocPage.classList.remove("active");
    
    if (pageId === "home") {
      homePage.classList.add("active");
      document.body.style.overflow = "hidden";
      tocBtn.classList.remove("visible");
      window.scrollTo(0, 0);
    } else if (pageId === "chapter") {
      chapterView.classList.add("active");
      document.body.style.overflow = "";
      tocBtn.classList.add("visible");
    } else if (pageId === "toc") {
      tocPage.classList.add("active");
      document.body.style.overflow = "hidden";
      tocBtn.classList.remove("visible");
    }
  }

  // ── Characters Loader & Details ──
  const charModal = document.getElementById("char-modal");
  const charModalAvatar = document.getElementById("char-card-avatar");
  const charModalName = document.getElementById("char-modal-name");
  const charModalRole = document.getElementById("char-card-role");
  const charModalBio = document.getElementById("char-card-bio");
  const charModalClose = document.getElementById("char-card-close");

  function loadCharacterData(id) {
    if (characterCache[id]) return Promise.resolve(characterCache[id]);
    return new Promise((resolve) => {
      window.__SAP_CHARACTER__ = (charData) => {
        characterCache[id] = charData;
        resolve(charData);
      };
      loadScript(`characters/${id}.js`).catch(() => {
        resolve(null);
      });
    });
  }

  function showCharacterModal(c) {
    charModalAvatar.src = c.avatar || "icons/apple-touch-icon.png";
    charModalName.textContent = c.name;
    charModalRole.textContent = c.role || "ตัวละคร";
    charModalBio.textContent = c.description || "";
    charModal.classList.add("active");
  }

  function hideCharacterModal() {
    charModal.classList.remove("active");
  }

  charModalClose.addEventListener("click", hideCharacterModal);
  charModal.addEventListener("click", (e) => {
    if (e.target === charModal) hideCharacterModal();
  });

  // ── localStorage Progress ──
  const STORAGE_KEY = "sap_reading_progress";

  function saveProgress() {
    const scrollPct = window.scrollY / (document.body.scrollHeight - window.innerHeight || 1);
    const chaptersRead = getProgress().chaptersRead || [];
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      currentChapter: currentChapterNum,
      currentScrollPosition: Math.min(1, Math.max(0, scrollPct)),
      chaptersRead,
      lastReadAt: new Date().toISOString()
    }));
  }

  function markChapterRead(n) {
    const p = getProgress();
    if (!p.chaptersRead.includes(n)) {
      p.chaptersRead.push(n);
      p.chaptersRead.sort((a, b) => a - b);
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
  }

  function getProgress() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { currentChapter: 0, currentScrollPosition: 0, chaptersRead: [] };
    } catch { return { currentChapter: 0, currentScrollPosition: 0, chaptersRead: [] }; }
  }

  // Save progress on scroll (debounced)
  let scrollTimer;
  window.addEventListener("scroll", () => {
    if (currentChapterNum > 0) {
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(saveProgress, 400);
    }
    // Mark chapter read if user scrolled near bottom
    if (currentChapterNum > 0) {
      const scrollPct = window.scrollY / (document.body.scrollHeight - window.innerHeight || 1);
      if (scrollPct > 0.9) markChapterRead(currentChapterNum);
    }
  });

  // ── Script Loader (JSONP-style) ──
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error("Failed to load " + src));
      document.head.appendChild(s);
    });
  }

  // ── TOC ──
  function buildTOC() {
    const progress = getProgress();
    tocListEl.innerHTML = chapterList.map(ch => {
      const isRead = progress.chaptersRead.includes(ch.chapter);
      const isCurrent = ch.chapter === currentChapterNum;
      const status = isRead ? "✓" : isCurrent ? "→" : "";
      return `<li class="toc-item" data-chapter="${ch.chapter}">
        <span class="toc-num">บทที่ ${ch.chapter}</span>
        <span class="toc-info">
          <div class="toc-info-title">${esc(ch.title)}</div>
          <div class="toc-info-sub">${esc(ch.subtitle)}</div>
        </span>
        <span class="toc-status">${status}</span>
      </li>`;
    }).join("");

    tocListEl.querySelectorAll(".toc-item").forEach(item => {
      item.addEventListener("click", () => {
        const n = parseInt(item.dataset.chapter);
        loadChapter(n).then(() => {
          showPage("chapter");
          window.scrollTo(0, 0);
        });
      });
    });
  }

  tocBtn.addEventListener("click", () => {
    buildTOC();
    showPage("toc");
  });
  tocClose.addEventListener("click", () => {
    if (currentChapterNum > 0) {
      showPage("chapter");
    } else {
      showPage("home");
    }
  });
  tocHome.addEventListener("click", () => {
    showPage("home");
  });

  // ── Home Page Actions ──
  document.getElementById("home-start-btn").addEventListener("click", () => {
    loadChapter(1).then(() => {
      showPage("chapter");
      window.scrollTo(0, 0);
    });
  });
  document.getElementById("home-toc-btn").addEventListener("click", () => {
    buildTOC();
    showPage("toc");
  });

  // ── Chapter Rendering ──
  function renderChapter(data) {
    currentChapter = data;
    currentChapterNum = data.chapter;

    // Update header
    eyebrowEl.textContent = `บทที่ ${data.chapter}`;
    titleEl.textContent = data.title || APP.title;
    subtitleEl.textContent = data.subtitle || "";
    document.title = `${data.title} — ${APP.title}`;

    // Hero image
    if (data.heroImage) {
      const show = () => { heroFig.hidden = false; heroFig.classList.add("seen"); };
      heroImg.onload = show;
      heroImg.onerror = () => { heroFig.hidden = true; };
      heroImg.alt = data.heroCaption || "";
      heroImg.src = data.heroImage;
      heroCap.textContent = data.heroCaption || "";
      heroFig.hidden = false;
      heroFig.classList.remove("seen");
      if (heroImg.complete && heroImg.naturalWidth > 0) show();
      setTimeout(() => { if (heroImg.naturalWidth > 0) show(); }, 1500);
    } else {
      heroFig.hidden = true;
    }

    // Blocks
    mainEl.innerHTML = (data.blocks || []).map(renderBlock).join(`<div class="divider"></div>`);
    observeBlocks();

    // Characters
    charListEl.innerHTML = "";
    if (data.characters && data.characters.length > 0) {
      Promise.all(data.characters.map(loadCharacterData)).then((chars) => {
        const validChars = chars.filter(c => c !== null);
        if (validChars.length > 0) {
          charListEl.innerHTML = validChars.map(c => `
            <li class="character-badge" data-id="${c.id}">
              <img class="character-avatar" src="${esc(c.avatar)}" alt="${esc(c.name)}" />
              <span class="character-name">${esc(c.name)}</span>
            </li>
          `).join("");
          
          charListEl.querySelectorAll(".character-badge").forEach(badge => {
            badge.addEventListener("click", () => {
              const c = characterCache[badge.dataset.id];
              if (c) showCharacterModal(c);
            });
          });
          charSection.hidden = false;
        } else {
          charSection.hidden = true;
        }
      });
    } else {
      charSection.hidden = true;
    }

    // Navigation
    updateNav();

    // Save progress
    saveProgress();
  }

  function updateNav() {
    const idx = chapterList.findIndex(c => c.chapter === currentChapterNum);
    const prev = idx > 0 ? chapterList[idx - 1] : null;
    const next = idx < chapterList.length - 1 ? chapterList[idx + 1] : null;

    if (prev) {
      navPrev.disabled = false;
      navPrevLabel.textContent = `บทที่ ${prev.chapter}`;
      navPrev.onclick = () => { loadChapter(prev.chapter); window.scrollTo(0, 0); };
    } else {
      navPrev.disabled = true;
    }

    if (next) {
      navNext.disabled = false;
      navNextLabel.textContent = `บทที่ ${next.chapter}`;
      navNext.onclick = () => { loadChapter(next.chapter); window.scrollTo(0, 0); };
    } else {
      navNext.disabled = true;
    }
  }

  // ── Lazy Chapter Loading ──
  function loadChapter(n) {
    return new Promise((resolve) => {
      window.__SAP_CHAPTER__ = (data) => {
        renderChapter(data);
        resolve(data);
      };
      loadScript(`chapters/chapter-${n}.js`).catch(() => {
        mainEl.innerHTML = `<div class="block b-text seen"><p>ไม่พบบทที่ ${n}</p></div>`;
        resolve(null);
      });
    });
  }

  // ── Init ──
  window.__SAP_CHAPTERS__ = (list) => {
    chapterList = list;
    buildTOC();

    const progress = getProgress();

    if (progress.currentChapter > 0) {
      // Returning reader — resume last chapter
      loadChapter(progress.currentChapter).then(() => {
        showPage("chapter");
        // Restore scroll position after a brief delay for rendering
        if (progress.currentScrollPosition > 0) {
          setTimeout(() => {
            const target = progress.currentScrollPosition * (document.body.scrollHeight - window.innerHeight);
            window.scrollTo(0, target);
          }, 300);
        }
      });
    } else {
      // First visit — show the Home page cover!
      showPage("home");
    }
  };

  // Load the chapter manifest
  loadScript("chapters/index.js").catch(() => {
    // Fallback: if manifest fails, try to load chapter 1 directly
    chapterList = [{ chapter: 1, title: "คืนที่เบาที่สุด", subtitle: "ฉากแรก" }];
    loadChapter(1).then(() => showPage("chapter"));
  });

  // ── Register Service Worker ──
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker registered', reg))
        .catch(err => console.log('Service Worker registration failed', err));
    });
  }

  /* ── dreamy flowing gradient (WebGL) ── */
  const canvas = document.getElementById("gradient");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
  if (!gl) { canvas.style.background = "linear-gradient(135deg,#efe6d2 0%,#bcd0c9 40%,#6B9080 65%,#e1be9c 100%)"; return; }

  const vs = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.0,1.0); }`;
  const fs = `
    precision highp float;
    uniform vec2 u_res; uniform float u_t;

    /* SAP palette — very soft tints, close to paper */
    vec3 cA = vec3(0.937, 0.902, 0.823);   /* warm cream  — base        */
    vec3 cB = vec3(0.855, 0.890, 0.870);   /* pale sage hint            */
    vec3 cC = vec3(0.900, 0.920, 0.910);   /* barely-there sage mist    */
    vec3 cD = vec3(0.925, 0.880, 0.835);   /* faint warm sand           */
    vec3 cE = vec3(0.880, 0.900, 0.890);   /* whisper sage              */

    /* 2D simplex noise — produces organic blobs */
    vec3 mod289(vec3 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
    vec2 mod289v2(vec2 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
    vec3 permute(vec3 x){ return mod289((x * 34.0 + 1.0) * x); }
    float snoise(vec2 v){
      const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                         -0.577350269189626, 0.024390243902439);
      vec2 i = floor(v + dot(v, C.yy));
      vec2 x0 = v - i + dot(i, C.xx);
      vec2 i1 = (x0.x > x0.y) ? vec2(1.0,0.0) : vec2(0.0,1.0);
      vec4 x12 = x0.xyxy + C.xxzz;
      x12.xy -= i1;
      i = mod289v2(i);
      vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0))
                                   + i.x + vec3(0.0, i1.x, 1.0));
      vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy),
                               dot(x12.zw,x12.zw)), 0.0);
      m = m * m; m = m * m;
      vec3 x_ = 2.0 * fract(p * C.www) - 1.0;
      vec3 h = abs(x_) - 0.5;
      vec3 ox = floor(x_ + 0.5);
      vec3 a0 = x_ - ox;
      m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
      vec3 g;
      g.x = a0.x * x0.x + h.x * x0.y;
      g.yz = a0.yz * x12.xz + h.yz * x12.yw;
      return 130.0 * dot(m, g);
    }

    void main(){
      vec2 uv = gl_FragCoord.xy / u_res;
      uv.x *= u_res.x / u_res.y;
      float t = u_t * 0.06;

      /* diagonal coordinate — gentle Sunset sweep */
      float diag = (uv.x + uv.y) * 0.5;

      /* layered organic noise at different scales */
      float n1 = snoise(uv * 1.4 + vec2(t * 0.3, t * 0.2)) * 0.5 + 0.5;
      float n2 = snoise(uv * 2.2 - vec2(t * 0.15, t * 0.25) + 5.0) * 0.5 + 0.5;
      float n3 = snoise(uv * 0.8 + vec2(t * 0.1, -t * 0.12) + 10.0) * 0.5 + 0.5;

      /* blend zones */
      float zone1 = smoothstep(0.2, 0.7, diag + n1 * 0.4 - 0.15);
      float zone2 = smoothstep(0.3, 0.8, n2 + diag * 0.3);
      float zone3 = smoothstep(0.25, 0.75, n3);

      /* build final color — very gentle tints over cream */
      vec3 col = cA;
      col = mix(col, cD, zone1 * 0.25);
      col = mix(col, cB, zone2 * 0.2);
      col = mix(col, cC, zone3 * 0.15);
      col = mix(col, cE, (1.0 - zone1) * n3 * 0.12);

      /* soft vignette — fade edges to cream */
      vec2 vc = gl_FragCoord.xy / u_res - 0.5;
      col = mix(col, cA, smoothstep(0.3, 1.0, length(vc)) * 0.55);

      gl_FragColor = vec4(col, 1.0);
    }`;
  function compile(t,s){ const sh=gl.createShader(t); gl.shaderSource(sh,s); gl.compileShader(sh); return sh; }
  const prog = gl.createProgram();
  gl.attachShader(prog,compile(gl.VERTEX_SHADER,vs));
  gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog,"p"); gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const uRes = gl.getUniformLocation(prog,"u_res"), uT = gl.getUniformLocation(prog,"u_t");
  function resize(){ const dpr=Math.min(window.devicePixelRatio||1,1.6); canvas.width=Math.floor(innerWidth*dpr); canvas.height=Math.floor(innerHeight*dpr); gl.viewport(0,0,canvas.width,canvas.height); gl.uniform2f(uRes,canvas.width,canvas.height); }
  window.addEventListener("resize",resize); resize();
  const start = performance.now();
  function frame(now){ gl.uniform1f(uT,(now-start)/1000); gl.drawArrays(gl.TRIANGLES,0,3); if(!reduce) requestAnimationFrame(frame); }
  if (reduce){ gl.uniform1f(uT,8.0); gl.drawArrays(gl.TRIANGLES,0,3); } else requestAnimationFrame(frame);
})();
</script>
</body>
</html>
